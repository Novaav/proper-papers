# Tight limits for the real-engine tests of exceeded limits: an input or its
# decompressed content beyond 1 MiB must be reported (Heuristics.Limits.Exceeded),
# never passed as clean. Otherwise identical to clamd.conf.
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0

# Uploads are at most 20 MiB (the API refuses larger bodies first).
StreamMaxLength 21M
MaxFileSize 1M
MaxScanSize 1M
MaxRecursion 17
MaxScanTime 20000

# Without these, files that exceed a limit and encrypted documents or archives
# (also embedded ones the engine extracts) pass as clean.
AlertExceedsMax yes
AlertEncrypted yes
HeuristicAlerts yes
ScanPDF yes

MaxThreads 10
MaxQueue 100
ReadTimeout 30
CommandReadTimeout 5
SelfCheck 600
ConcurrentDatabaseReload yes
