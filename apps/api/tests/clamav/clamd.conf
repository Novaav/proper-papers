# clamd configuration for the real-engine tests; the production settings of
# docs/deployment-security.md (malware scanning). Inside the container clamd
# listens on all interfaces; the CI job publishes the port on 127.0.0.1 only.
# The LocalSocket path is the one the official image's entrypoint waits for.
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0

# Uploads are at most 20 MiB (the API refuses larger bodies first).
StreamMaxLength 21M
MaxFileSize 25M
MaxScanSize 100M
MaxRecursion 17
MaxScanTime 20000

# Without these, files that exceed a limit and encrypted documents or archives
# (also embedded ones the engine extracts) pass as clean.
AlertExceedsMax yes
AlertEncrypted yes
HeuristicAlerts yes
ScanPDF yes

MaxThreads 10
MaxQueue 100
ReadTimeout 30
CommandReadTimeout 5
SelfCheck 600
ConcurrentDatabaseReload yes
