[project]
name = "docparser"
version = "0.1.0"
description = "Sandboxed PDF text parser: runs only inside the isolated parser container."
readme = "README.md"
requires-python = ">=3.14,<3.15"
# Exact pin: this package parses untrusted PDFs, so every upgrade is a reviewed
# change (corpus goldens and sandbox tests must pass on the new version).
dependencies = [
    "pdfminer.six==20260107",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests", "scripts"]
# The corpus generator (standard library only) is type-checked through the tests.
mypy_path = "../../corpus"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
